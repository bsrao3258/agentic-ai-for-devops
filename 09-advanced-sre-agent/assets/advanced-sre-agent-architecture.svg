<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
<title id="title">Advanced SRE Agent Architecture</title>
<desc id="desc">Read-only evidence collection feeds incident correlation and runbook retrieval. A reviewer checks hypotheses before an approval and policy gate. Approved actions are verified and audited.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#182a44"/></linearGradient>
<linearGradient id="blue"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<linearGradient id="teal"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
<linearGradient id="purple"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".35"/></filter>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#93c5fd"/></marker>
<style>.heading{font:700 34px Arial,sans-serif;fill:#f8fafc}.sub{font:400 17px Arial,sans-serif;fill:#cbd5e1}.label{font:700 20px Arial,sans-serif;fill:#fff}.small{font:400 15px Arial,sans-serif;fill:#e2e8f0}.line{stroke:#93c5fd;stroke-width:3;fill:none;marker-end:url(#arrow)}.card{stroke:#fff;stroke-opacity:.18;stroke-width:1.5;rx:18;filter:url(#shadow)}</style>
</defs>
<rect width="1400" height="920" rx="28" fill="url(#bg)"/><circle cx="1240" cy="110" r="180" fill="#2563eb" opacity=".08"/><circle cx="120" cy="820" r="220" fill="#14b8a6" opacity=".08"/>
<text x="70" y="72" class="heading">ADVANCED SRE AGENT</text><text x="70" y="105" class="sub">Evidence first · Human approval · Verify every change</text>
<rect x="70" y="145" width="1260" height="105" fill="#172554" class="card"/><text x="700" y="180" class="label" text-anchor="middle">1 · OBSERVE — Read-only evidence sources</text><text x="700" y="215" class="small" text-anchor="middle">Kubernetes API · Events · Redacted logs · Prometheus metrics · Traces</text>
<path d="M700 250 V290" class="line"/><rect x="370" y="295" width="660" height="88" fill="url(#blue)" class="card"/><text x="700" y="330" class="label" text-anchor="middle">2 · NORMALIZE &amp; CORRELATE</text><text x="700" y="357" class="small" text-anchor="middle">Timeline · resource relationships · explicit evidence · uncertainty</text>
<path d="M700 383 V420 H350 V450" class="line"/><path d="M700 420 H1050 V450" class="line"/>
<rect x="95" y="455" width="510" height="100" fill="url(#teal)" class="card"/><text x="350" y="490" class="label" text-anchor="middle">3A · RUNBOOK RETRIEVAL</text><text x="350" y="520" class="small" text-anchor="middle">Approved procedures · citations · version metadata</text>
<rect x="795" y="455" width="510" height="100" fill="url(#purple)" class="card"/><text x="1050" y="490" class="label" text-anchor="middle">3B · HYPOTHESIS WRITER</text><text x="1050" y="520" class="small" text-anchor="middle">Possible causes · evidence links · uncertainty</text>
<path d="M350 555 V590 H700 V615" class="line"/><path d="M1050 555 V590 H700" class="line"/>
<rect x="370" y="620" width="660" height="78" fill="#334155" class="card"/><text x="700" y="651" class="label" text-anchor="middle">4 · EVIDENCE REVIEW + POLICY GATE</text><text x="700" y="677" class="small" text-anchor="middle">Reject unsupported fixes · scope target · risk-check action</text>
<path d="M700 698 V730 H355 V755" class="line"/><path d="M700 730 H1045 V755" class="line"/>
<rect x="95" y="760" width="510" height="92" fill="#7f1d1d" class="card"/><text x="350" y="794" class="label" text-anchor="middle">NO APPROVAL / UNKNOWN</text><text x="350" y="823" class="small" text-anchor="middle">Investigate only · report uncertainty · no change</text>
<rect x="795" y="760" width="510" height="92" fill="#166534" class="card"/><text x="1050" y="794" class="label" text-anchor="middle">EXPLICIT APPROVAL</text><text x="1050" y="823" class="small" text-anchor="middle">Scoped action → verification → audit</text>
<text x="700" y="890" class="sub" text-anchor="middle">Illustrative target architecture — not every capability is implemented yet.</text>
</svg>